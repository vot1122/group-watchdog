name: watchdog

# Self-chaining design (replaces the 5-minute cron relay):
#   - ONE runner at a time, guaranteed by the concurrency group below: a new
#     run QUEUES behind the current one and is never allowed to cancel it
#   - ~30 min before the job limit, the bot itself dispatches the NEXT run
#     with the PAT token (GitHub refuses chain-dispatches via the built-in
#     GITHUB_TOKEN), then exits cleanly so the final state push happens
#   - the queued run starts the moment this job finishes, restores the
#     AES-encrypted database from the `state` branch and takes over
#   - the guard workflow resurrects the chain if it ever breaks
#   -> PAT_TOKEN secret is REQUIRED (classic PAT, repo scope, no expiry)

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "What to forward to the log group (also changeable live: /level in the log group)"
        required: false
        default: "everything"
        type: choice
        options:
          - everything
          - notable
          - alerts

concurrency:
  group: watchdog-runner
  cancel-in-progress: false      # NEVER cancel the watching run - queue behind it

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      GROUP: ${{ secrets.GROUP }}
      LOG_GROUP: ${{ secrets.LOG_GROUP }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: https://ntfy.sh
      TG_LOG_LEVEL: ${{ github.event.inputs.log_level || 'everything' }}
      # MANUAL_LEVEL is non-empty only when you picked a level in the
      # "Run workflow" dropdown - that choice is saved and beats /level.
      MANUAL_LEVEL: ${{ github.event.inputs.log_level }}
      LOG_MESSAGE_TEXT: "0"
      SNAPSHOT_EVERY: "30"
      PRUNE_DAYS: "30"
      DB_PASS: ${{ secrets.DB_PASS }}
      # PAT chain (see bot.py: chain_next_run)
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      CHAIN_AFTER_MIN: "330"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore saved state
        run: |
          set -e
          git fetch origin state --depth=1 2>/dev/null || true
          python -m pip install --quiet telethon
          if git cat-file -e origin/state:presence.db.enc 2>/dev/null; then
            git show origin/state:presence.db.enc > presence.db.enc
            # try the hardened 310k-iteration format first, fall back to the
            # legacy 10k format for the blob already on the state branch
            openssl enc -aes-256-cbc -pbkdf2 -iter 310000 -d \
              -in presence.db.enc -pass env:DB_PASS 2>/dev/null | gunzip > presence.db \
              || openssl enc -aes-256-cbc -pbkdf2 -d \
                   -in presence.db.enc -pass env:DB_PASS 2>/dev/null | gunzip > presence.db
            if [ -s presence.db ]; then
              echo "Restored database from state branch."
            else
              echo "Failed to decrypt presence.db.enc - check the DB_PASS secret."
              exit 1
            fi
            rm presence.db.enc
          else
            echo "No saved database yet - starting fresh."
          fi

      - name: Run watchdog (~5h30m, then hand over to the already-queued next run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash sync_state.sh &                       # push state right away
          ( while true; do sleep 240; bash sync_state.sh >/dev/null 2>&1 || true; done ) &
          SIDECAR=$!
          CODE=0
          timeout --signal=SIGINT --kill-after=90 348m python bot.py || CODE=$?
          kill "$SIDECAR" 2>/dev/null || true
          bash sync_state.sh full                     # final, complete state push
          # 124/130 = our own planned stop (timeout / SIGINT) - not a failure
          case "$CODE" in 0|124|130) exit 0 ;; *) exit "$CODE" ;; esac
